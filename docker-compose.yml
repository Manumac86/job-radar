# Job Radar — everything on this machine only (design D10, local-operation spec).
# Every published port binds to 127.0.0.1; nothing is reachable from the network.
name: job-radar

services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: job-radar-web:local
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      WORKER_URL: http://worker:4000
      # Dates, quiet hours and daily caps use this zone (e.g. TZ=America/New_York in .env).
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
    depends_on:
      worker: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: job-radar-worker:local
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${WORKER_PORT:-4000}:4000"
      # noVNC login viewer: only listening while a login session is open.
      - "127.0.0.1:${VIEWER_PORT:-6080}:6080"
    environment:
      WEB_BASE_URL: http://127.0.0.1:${WEB_PORT:-3000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
      # Claude OAuth token, Telegram token and chat id, IMAP app password. Read-only, worker only.
      - ./secrets:/run/job-radar-secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
